<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#065f46" />
    <meta name="description" content="A friendly 8-ball pool league tracker — matchups, bookings, results and stats." />
    <title>Pool League</title>
    <!-- Set the colour scheme before first paint so dark-mode users don't see a white flash. -->
    <script>
      try {
        var s = localStorage.getItem('mantine-color-scheme-value') || 'auto'
        if (s === 'auto') s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-mantine-color-scheme', s)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
